<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - GBA Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor-emulador">
        <div id="game"></div>
    </div>

   <script>
        EJS_player = '#game';
        EJS_core = 'gba'; 
        
        // Lo ponemos en false para que NO busque ningún archivo roto al cargar la página
        EJS_startOnLoaded = false; 
        
        EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/'; 
        EJS_language = 'en';
        EJS_loadIcons = true;

        // BORRAMOS COMPLETAMENTE LA LÍNEA DE EJS_gameUrl PARA EVITAR CRASHES
    </script>
    
    <script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>
</body>
</html>
