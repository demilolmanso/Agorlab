<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - GBA Station</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .zona-interfaz {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }
        .boton-cargar {
            background: #2563eb;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transition: all 0.2s;
        }
        .boton-cargar:hover { 
            background: #1d4ed8; 
            transform: translateY(-2px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="contenedor-emulador">
        <div id="pantalla-emulador" style="width: 100%; height: 100%;">
            <div class="zona-interfaz">
                <p style="font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #fff;">Estación Game Boy Advance</p>
                <p style="color: #888; font-size: 14px; max-width: 400px; line-height: 1.5;">
                    Cargá tu archivo de Pokémon Esmeralda (.gba) para iniciar la consola virtual local.
                </p>
                
                <input type="file" id="file-input" accept=".gba" style="display: none;">
                <button class="boton-cargar" onclick="document.getElementById('file-input').click()">Cargar Pokémon Esmeralda</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const blob = new Blob([event.target.result], { type: 'application/octet-stream' });
                const blobURL = URL.createObjectURL(blob);

                // Inyectamos un emulador web limpio encapsulado vía iframe que se traga el blob local sin errores de definición
                const contenedor = document.getElementById('pantalla-emulador');
                contenedor.innerHTML = `<iframe src="https://emupedia.net/emupedia-data/emulators/gba/?rom=${encodeURIComponent(blobURL)}"></iframe>`;
            };
            reader.readAsArrayBuffer(file);
        });
    </script>

</body>
</html>
