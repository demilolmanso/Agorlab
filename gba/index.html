<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBA Player Nativo - Agorlab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        #box-container {
            width: 480px;
            height: 320px;
            max-width: 95vw;
            background: #1f2937;
            border: 3px dashed #10b981;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            border-radius: 9px;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 20px;
            background: #1f2937;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #9ca3af;
            text-align: center;
            max-width: 480px;
        }
    </style>
</head>
<body>

    <h1>Pokémon Edición Esmeralda</h1>

    <input type="file" id="rom-chooser" accept=".gba" style="display: none;">

    <div id="box-container" id="clickable-zone">
        <div id="text-prompt" style="text-align: center; padding: 20px;">
            <p style="font-size: 1.1rem; margin-bottom: 8px; font-weight: bold;">Haz clic aquí para seleccionar Pokémon Esmeralda</p>
            <p style="font-size: 0.85rem; color: #9ca3af;">(Carga directa desde tu PC)</p>
        </div>
        <canvas id="game-screen"></canvas>
    </div>

    <div class="controls">
        <strong>Controles:</strong> Flechas (D-Pad) | Z (A) | X (B) | Enter (Start) | Espacio (Select)
    </div>

    <script src="https://unpkg.com/@gregarius/gbajs@1.1.0/dist/gbajs.min.js"></script>

    <script>
        const chooser = document.getElementById('rom-chooser');
        const zone = document.getElementById('box-container');
        const promptText = document.getElementById('text-prompt');
        const canvas = document.getElementById('game-screen');
        let instance = null;

        // Forzar la apertura del explorador de archivos nativo al hacer click
        zone.addEventListener('click', function() {
            if (!instance) {
                chooser.click();
            }
        });

        // Capturar cuando el usuario elige el juego
        chooser.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                promptText.style.display = 'none';
                canvas.style.display = 'block';
                zone.style.borderStyle = 'solid';

                try {
                    // Inicialización limpia tras la interacción del usuario (así Chrome no bloquea por HTTP)
                    instance = new GameBoyAdvance();
                    instance.setCanvas(canvas);
                    
                    const romData = new Uint8Array(e.target.result);
                    instance.loadRom(romData, function(err) {
                        if (err) {
                            alert("Error al cargar el archivo de juego.");
                            return;
                        }
                        instance.run();
                    });

                    // Configurar el teclado una vez que el motor está vivo
                    setupControls(instance);

                } catch (error) {
                    alert("Tu navegador bloqueó el inicio clásico. Intenta usar Firefox o activar HTTPS.");
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function setupControls(gba) {
            const keys = {
                38: gba.KEY_UP,
                40: gba.KEY_DOWN,
                37: gba.KEY_LEFT,
                39: gba.KEY_RIGHT,
                90: gba.KEY_A,
                88: gba.KEY_B,
                13: gba.KEY_START,
                32: gba.KEY_SELECT
            };

            window.addEventListener('keydown', (e) => {
                if (keys[e.keyCode] !== undefined) {
                    gba.keyDown(keys[e.keyCode]);
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (keys[e.keyCode] !== undefined) {
                    gba.keyUp(keys[e.keyCode]);
                    e.preventDefault();
                }
            });
        }
    </script>

</body>
</html>
