<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - GBA Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor-emulador">
        <div id="game"></div>
    </div>

    <script>
        EJS_player = '#game';
        EJS_core = 'gba'; 
        EJS_startOnLoaded = true; 
        
        // Cambiamos esta ruta por la versión fija de entrega (sin el 'stable' que a veces rompe)
        EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/'; 
    </script>
    
    <script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>
    
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
