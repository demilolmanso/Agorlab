<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBA Player - Agorlab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        #drop-zone {
            width: 480px;
            height: 320px;
            max-width: 95vw;
            background: #1f2937;
            border: 3px dashed #10b981;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        canvas {
            display: none;
            width: 100%;
            height: 100%;
            border-radius: 9px;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 20px;
            background: #1f2937;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #9ca3af;
            text-align: center;
            line-height: 1.5;
            max-width: 480px;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Pokémon Edición Esmeralda</h1>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div id="label-text" style="text-align: center; padding: 20px;">
            <p style="font-size: 1.1rem; margin-bottom: 8px; font-weight: bold;">Arrastra tu archivo Pokémon Esmeralda (.gba) aquí</p>
            <p style="font-size: 0.85rem; color: #9ca3af;">O haz clic aquí para buscarlo en tu PC</p>
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <input type="file" id="file-input" accept=".gba">

    <div class="controls">
        <strong>Controles del Teclado:</strong><br>
        Flechas (D-Pad) | Z (Botón A) | X (Botón B) <br>
        Enter (Start) | Barra Espaciadora (Select) | A (Gatillo L) | S (Gatillo R)
    </div>

    <script src="https://cdn.jsdelivr.net/gh/taisel/IodineGBA@master/IodineGBA/core/Cartridge.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/taisel/IodineGBA@master/IodineGBA/core/GBA.js"></script>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const labelText = document.getElementById('label-text');
        const canvas = document.getElementById('canvas');
        
        // Inicializar el motor amarrado al canvas
        const gba = new GameBoyAdvance();
        gba.setCanvas(canvas);

        // Capturar la selección de archivo nativa del navegador
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Evitar que el click en el canvas intente re-abrir el buscador una vez jugando
        dropZone.addEventListener('click', (e) => {
            if (canvas.style.display === 'block') {
                e.stopPropagation();
                e.preventDefault();
            }
        });

        // Soporte para arrastrar el archivo encima
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                // Intercambiar interfaz limpia
                labelText.style.display = 'none';
                canvas.style.display = 'block';
                dropZone.style.borderStyle = 'solid';

                // Inyectar binario de la ROM y arrancar
                const romBuffer = new Uint8Array(event.target.result);
                gba.loadRom(romBuffer);
                gba.run();
            };
            reader.readAsArrayBuffer(file);
        }

        // Mapeo de controles por teclado directo a la API de IodineGBA
        const keys = {
            38: gba.KEY_UP,
            40: gba.KEY_DOWN,
            37: gba.KEY_LEFT,
            39: gba.KEY_RIGHT,
            90: gba.KEY_A,        // Z -> A
            88: gba.KEY_B,        // X -> B
            13: gba.KEY_START,    // Enter -> Start
            32: gba.KEY_SELECT,   // Espacio -> Select
            65: gba.KEY_L,        // A -> L
            83: gba.KEY_R         // S -> R
        };

        window.addEventListener('keydown', (e) => {
            if (keys[e.keyCode] !== undefined) {
                gba.keyDown(keys[e.keyCode]);
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys[e.keyCode] !== undefined) {
                gba.keyUp(keys[e.keyCode]);
                e.preventDefault();
            }
        });
    </script>

</body>
</html>
