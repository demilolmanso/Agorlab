<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - GBA Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor-emulador">
        <div id="game"></div>
    </div>

    <script>
        EJS_player = '#game';
        EJS_core = 'gba'; 
        EJS_startOnLoaded = true; 
        EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/'; 
        EJS_language = 'en';
        EJS_loadIcons = true;

        // AGREGAMOS ESTA LÍNEA (Un juego indie de naves súper liviano para activar el emulador):
        EJS_gameUrl = 'https://raw.githubusercontent.com/VisualBoyAdvance-M/visualboyadvance-m/master/src/bready.gba';
    </script>
    
    <script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>

</body>
</html>
