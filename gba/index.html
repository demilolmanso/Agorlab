<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - GBA Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor-emulador">
        <div id="game"></div>
    </div>

    <script>
        EJS_player = '#game';
        EJS_core = 'gba'; 
        EJS_startOnLoaded = true; 
        
        // Usamos latest que ya vimos que conecta bien
        EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/'; 
        
        // AGREGAMOS ESTAS LÍNEAS PARA DESTRABAR EL REPRODUCTOR:
        EJS_language = 'en'; // Fuerza el idioma base para evitar que busque traducciones rotas
        EJS_loadIcons = true; // Fuerza la carga de los botones de la interfaz
    </script>
    
    <script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>

</body>
</html>
