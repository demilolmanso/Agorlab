<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - Bitácora</title>
    <style>
        body { 
            background-color: rgb(226, 226, 226); 
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            margin: 0;
            padding: 20px;
        }

        .header-blog {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .header-blog h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .btn-volver {
            color: #ca630e;
            text-decoration: none;
            font-weight: bold;
            border: 1px dashed #ca630e;
            padding: 5px 10px;
            transition: all 0.2s ease;
        }

        .btn-volver:hover {
            background-color: #ca630e;
            color: rgb(226, 226, 226);
        }

        .contenedor-tweets {
            max-width: 650px;
            margin: 0 auto;
        }

        .tweet-card {
            background-color: rgb(235, 235, 235);
            border-left: 4px solid #ca630e;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        .tweet-fecha {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .tweet-contenido {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .cargando {
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-blog">
        <h1>[ LAB_LOG ]</h1>
        <a href="../" class="btn-volver"><- Volver al inicio</a>
    </div>

    <main class="contenedor-tweets" id="feed-tweets">
        <p class="cargando">Conectando con el laboratorio...</p>
    </main>

    <script>
        const contenedor = document.getElementById('feed-tweets');

        async function cargarTweets() {
            try {
                // Le pedimos a la API local de Git Gateway (Netlify) que nos traiga la lista de archivos
                // Esto funciona siempre, sin importar si el repo de GitHub es privado
                const respuesta = await fetch('/.netlify/git/gateway/entries');
                
                if (!respuesta.ok) {
                    contenedor.innerHTML = "<p class='cargando'>Aún no hay publicaciones en la bitácora o necesitas iniciar sesión.</p>";
                    return;
                }

                const datos = await respuesta.json();
                
                // Filtramos para quedarnos solo con los archivos que están dentro de microblog/posts
                const posts = datos.filter(item => item.path.startsWith('microblog/posts/'));

                if (posts.length === 0) {
                    contenedor.innerHTML = "<p class='cargando'>Aún no hay publicaciones en la bitácora. ¡Escribí la primera desde /admin!</p>";
                    return;
                }

                contenedor.innerHTML = '';

                // Los ordenamos para que el más nuevo salga arriba de todo
                posts.sort((a, b) => new Date(b.data.date) - new Date(a.data.date));

                for (let post of posts) {
                    // Decap CMS guarda los campos dentro del objeto 'data'
                    const tweetTexto = post.data.body || '';
                    const fechaRaw = post.data.date;

                    let fechaFormateada = "Fecha desconocida";
                    if (fechaRaw) {
                        const d = new Date(fechaRaw);
                        fechaFormateada = d.toLocaleDateString('es-AR', {
                            day: '2-digit',
                            month: '2-digit',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    }

                    const tweetHtml = `
                        <article class="tweet-card">
                            <div class="tweet-fecha">${fechaFormateada} hs</div>
                            <div class="tweet-contenido">${tweetTexto}</div>
                        </article>
                    `;
                    contenedor.innerHTML += tweetHtml;
                }

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = "<p class='cargando'>Error al conectar con el laboratorio.</p>";
            }
        }

        // Ejecutar la carga
        cargarTweets();
    </script>
</body>
</html>
