<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - Bitácora</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body { 
            background-color: rgb(226, 226, 226); 
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            margin: 0;
            padding: 20px;
        }

        .header-blog {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .header-blog h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .btn-volver {
            color: #ca630e;
            text-decoration: none;
            font-weight: bold;
            border: 1px dashed #ca630e;
            padding: 5px 10px;
            transition: all 0.2s ease;
        }

        .btn-volver:hover {
            background-color: #ca630e;
            color: rgb(226, 226, 226);
        }

        .contenedor-tweets {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Estilo minimalista para cada tweet */
        .tweet-card {
            background-color: rgb(235, 235, 235);
            border-left: 4px solid #ca630e;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        .tweet-fecha {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .tweet-contenido {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .tweet-foto {
            max-width: 100%;
            height: auto;
            display: block;
            margin-top: 15px;
            border: 1px solid #ca630e; 
            box-shadow: 2px 2px 0px #ca630e; 
        }

        .tweet-video-container {
            max-width: 100%;
            margin-top: 15px;
            border: 1px solid #ca630e;
            box-shadow: 2px 2px 0px #ca630e;
            overflow: hidden;
        }

        .tweet-video-container iframe {
            width: 100%;
            display: block;
        }

        /* Botón de Likes */
        .tweet-acciones {
            margin-top: 20px;
        }

        .btn-like {
            background: transparent;
            border: 1px dashed #ca630e;
            color: #ca630e;
            padding: 5px 12px;
            font-family: inherit;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-like:hover {
            background-color: #ca630e;
            color: rgb(226, 226, 226);
        }

        .btn-like.liked {
            background-color: #ca630e;
            color: rgb(226, 226, 226);
            border-style: solid;
        }

        .cargando {
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-blog">
        <h1>[ LAB_LOG ]</h1>
        <a href="../" class="btn-volver"><- Volver al inicio</a>
    </div>

    <main class="contenedor-tweets" id="feed-tweets">
        <p class="cargando">Conectando con el laboratorio público...</p>
    </main>
