<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - Bitácora</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body { 
            background-color: rgb(226, 226, 226); 
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            margin: 0;
            padding: 20px;
        }

        .header-blog {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .header-blog h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .btn-volver {
            color: #ca630e;
            text-decoration: none;
            font-weight: bold;
            border: 1px dashed #ca630e;
            padding: 5px 10px;
            transition: all 0.2s ease;
        }

        .btn-volver:hover {
            background-color: #ca630e;
            color: rgb(226, 226, 226);
        }

        .contenedor-tweets {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Estilo minimalista para cada tweet */
        .tweet-card {
            background-color: rgb(33, 19, 8);
            border-left: 4px solid #ca630e;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        .tweet-fecha {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .tweet-contenido {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Estilo personalizado y hacker para tus links internos del texto */
        .tweet-contenido a {
            color: #ca630e;
            text-decoration: underline dotted;
            font-weight: bold;
        }

        .tweet-contenido a:hover {
            background-color: #ca630e;
            color: rgb(226, 226, 226);
        }

        .tweet-foto {
            max-width: 100%;
            height: auto;
            display: block;
            margin-top: 15px;
            border: 1px solid #ca630e; 
            box-shadow: 2px 2px 0px #ca630e; 
        }

        /* Contenedor adaptado para videos */
        .tweet-video-container {
            max-width: 100%;
            margin-top: 15px;
            border: 1px solid #ca630e;
            box-shadow: 2px 2px 0px #ca630e;
            overflow: hidden;
            background: #000;
        }

        .tweet-video-container iframe, .tweet-video-container video {
            width: 100%;
            display: block;
            border: none;
            aspect-ratio: 16 / 9; /* Mantiene la proporción perfecta del reproductor */
        }

        .cargando {
            text-align: center;
            font-style: italic;
        }
        .contenedor-contacto {
    max-width: 650px;
    margin: 40px auto;
    padding: 20px;
    border: 1px solid #ca630e;
    background-color: rgba(33, 19, 8, 0.5);
}

.form-hacker {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 20px;
}

.form-hacker input, .form-hacker textarea {
    background: transparent;
    border: 1px solid #ca630e;
    padding: 10px;
    color: #ca630e;
    font-family: 'Courier New', Courier, monospace;
}

.form-hacker label {
    font-size: 0.9rem;
    font-weight: bold;
}

.form-hacker textarea {
    height: 100px;
    resize: vertical;
}
    </style>
</head>
<body>

    <div class="header-blog">
        <h1>[ LAB_LOG ]</h1>
        <a href="../" class="btn-volver"><- Volver al inicio</a>
    <section class="contenedor-contacto">
    <h2 style="text-align: center; font-size: 1.2rem;">[ ENVIAR_MENSAJE_AL_LAB ]</h2>
    
    <form action="https://formspree.io/f/mrevgnbz" method="POST" class="form-hacker">
        <label for="email">Tu correo:</label>
        <input type="email" name="email" id="email" required placeholder="tu@email.com">

        <label for="message">Mensaje:</label>
        <textarea name="message" id="message" required placeholder="Escribe aquí tu aporte..."></textarea>

        <button type="submit" class="btn-interactivo" style="width: 100%; cursor: pointer;">[ ENVIAR_DATOS ]</button>
    </form>
</section>

    <main class="contenedor-tweets" id="feed-tweets">
        <p class="cargando">Conectando con el laboratorio público...</p>
    </main>

    <script>
        const USUARIO_GITHUB = 'demilolmanso'; 
        const REPO_NAME = 'Agorlab'; 

        const contenedor = document.getElementById('feed-tweets');

        // Convierte texto plano con http/https en links reales HTML automáticamente
        function linkificarTexto(texto) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return texto.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        async function cargarTweets() {
            try {
                const urlApi = `https://api.github.com/repos/${USUARIO_GITHUB}/${REPO_NAME}/contents/microblog/posts`;
                const respuesta = await fetch(urlApi);
                
                if (!respuesta.ok) {
                    contenedor.innerHTML = "<p class='cargando'>El silencio invadió todas las casas de Italia...</p>";
                    return;
                }

                const archivos = await respuesta.json();
                contenedor.innerHTML = '';

                archivos.reverse();

                for (let archivo of archivos) {
                    if (archivo.name.endsWith('.md')) {
                        const resPost = await fetch(archivo.download_url);
                        const textoRaw = await resPost.text();

                        const partes = textoRaw.split('---');
                        if (partes.length >= 3) {
                            const metadata = partes[1];
                            const cuerpoRaw = partes.slice(2).join('---').trim();

                            // Aplicamos la conversión de links al cuerpo de la publicación
                            const cuerpo = linkificarTexto(cuerpoRaw);

                            // Extrae la fecha
                            const matchFecha = metadata.match(/date:\s*(.+)/);
                            let fechaFormateada = "Fecha desconocida";
                            
                            if (matchFecha) {
                                const d = new Date(matchFecha[1]);
                                fechaFormateada = d.toLocaleDateString('es-AR', {
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                });
                            }

                            // Extrae la foto
                            const matchFoto = metadata.match(/foto:\s*["']?([^"'\n\r]+)["']?/);
                            let fotoHtml = '';
                            if (matchFoto && matchFoto[1]) {
                                fotoHtml = `<img src="${matchFoto[1].trim()}" class="tweet-foto" alt="Imagen del laboratorio">`;
                            }

                            // Extrae el video (Tu lógica funcional intacta para Drive, Iframes e Iframe de YouTube)
                            const matchVideo = metadata.match(/video:\s*["']?([\s\S]*?)["']?(?=\n\w+:|$)/);
                            let videoHtml = '';

                            if (matchVideo && matchVideo[1] && matchVideo[1].trim() !== "") {
                                let urlVideo = matchVideo[1].trim();

                                if (urlVideo.includes('<iframe')) {
                                    videoHtml = `<div class="tweet-video-container">${urlVideo}</div>`;
                                } 
                                else if (urlVideo.includes('drive.google.com')) {
                                    let idDrive = '';
                                    if (urlVideo.includes('/d/')) {
                                        idDrive = urlVideo.split('/d/')[1].split('/')[0];
                                    } else if (urlVideo.includes('id=')) {
                                        idDrive = urlVideo.split('id=')[1].split('&')[0];
                                    }

                                    if (idDrive) {
                                        videoHtml = `
                                            <div class="tweet-video-container">
                                                <iframe src="https://drive.google.com/file/d/${idDrive}/preview" allow="autoplay"></iframe>
                                            </div>
                                        `;
                                    }
                                } 
                                else {
                                    videoHtml = `
                                        <div class="tweet-video-container">
                                            <video controls playsinline preload="metadata">
                                                <source src="${urlVideo}" type="video/mp4">
                                                Tu navegador no soporta reproducción de video.
                                            </video>
                                        </div>
                                    `;
                                }
                            }

                            const tweetHtml = `
                                <article class="tweet-card">
                                    <div class="tweet-fecha">${fechaFormateada} hs</div>
                                    <div class="tweet-contenido">${cuerpo}</div>
                                    ${fotoHtml}
                                    ${videoHtml}
                                </article>
                            `;
                            contenedor.innerHTML += tweetHtml;
                        }
                    }
                }

                if (contenedor.innerHTML === '') {
                    contenedor.innerHTML = "<p class='cargando'>No se encontraron posteos válidos.</p>";
                }

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = "<p class='cargando'>Error al conectar con la bitácora.</p>";
            }
        }

        cargarTweets();
    </script>
</body>
</html>
