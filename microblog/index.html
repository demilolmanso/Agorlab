<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - Bitácora</title>
    <style>
        body { 
            background-color: rgb(226, 226, 226); 
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            margin: 0;
            padding: 20px;
        }

        .header-blog {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .header-blog h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .btn-volver {
            color: #ca630e;
            text-decoration: none;
            font-weight: bold;
            border: 1px dashed #ca630e;
            padding: 5px 10px;
            transition: all 0.2s ease;
        }

        .btn-volver:hover {
            background-color: #ca630e;
            color: rgb(226, 226, 226);
        }

        .contenedor-tweets {
            max-width: 650px;
            margin: 0 auto;
        }

        .tweet-card {
            background-color: rgb(235, 235, 235);
            border-left: 4px solid #ca630e;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        .tweet-fecha {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .tweet-contenido {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .cargando {
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-blog">
        <h1>[ LAB_LOG ]</h1>
        <a href="../" class="btn-volver"><- Volver al inicio</a>
    </div>

    <main class="contenedor-tweets" id="feed-tweets">
        <p class="cargando">Conectando con el laboratorio...</p>
    </main>

    <script>
        const contenedor = document.getElementById('feed-tweets');

        async function cargarTweets() {
            try {
                // Leemos directo desde tu Netlify local sin tokens de GitHub
                const respuesta = await fetch('/tweets-index.json');
                
                if (!respuesta.ok) {
                    contenedor.innerHTML = "<p class='cargando'>Aún no hay publicaciones en la bitácora. ¡Escribí la primera desde /admin!</p>";
                    return;
                }

                const data = await respuesta.json();
                contenedor.innerHTML = '';

                // Obtenemos las entradas del objeto JSON
                const posts = Object.values(data).filter(p => p.body);

                if (posts.length === 0) {
                    contenedor.innerHTML = "<p class='cargando'>Aún no hay publicaciones guardadas.</p>";
                    return;
                }

                // Ordenamos para que salgan los más nuevos arriba
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                for (let post of posts) {
                    const d = new Date(post.date);
                    const fechaFormateada = d.toLocaleDateString('es-AR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    const tweetHtml = `
                        <article class="tweet-card">
                            <div class="tweet-fecha">${fechaFormateada} hs</div>
                            <div class="tweet-contenido">${post.body}</div>
                        </article>
                    `;
                    contenedor.innerHTML += tweetHtml;
                }

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = "<p class='cargando'>Error al cargar las bitácoras del laboratorio.</p>";
            }
        }

        // Ejecutar al cargar la página
        cargarTweets();
    </script>
</body>
</html>
