<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab - Bitácora</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body { 
            background-color: rgb(226, 226, 226); 
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            margin: 0;
            padding: 20px;
        }

        .header-blog {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .header-blog h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .btn-volver {
            color: #ca630e;
            text-decoration: none;
            font-weight: bold;
            border: 1px dashed #ca630e;
            padding: 5px 10px;
            transition: all 0.2s ease;
        }

        .btn-volver:hover {
            background-color: #ca630e;
            color: rgb(226, 226, 226);
        }

        .contenedor-tweets {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Estilo minimalista para cada tweet */
        .tweet-card {
            background-color: rgb(235, 235, 235);
            border-left: 4px solid #ca630e;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        .tweet-fecha {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .tweet-contenido {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .tweet-foto {
            max-width: 100%;
            height: auto;
            display: block;
            margin-top: 15px;
            border: 1px solid #ca630e; 
            box-shadow: 2px 2px 0px #ca630e; 
        }

        /* Contenedor adaptado para Reels y videos verticales */
        .tweet-video-container {
            max-width: 100%;
            margin-top: 15px;
            border: 1px solid #ca630e;
            box-shadow: 2px 2px 0px #ca630e;
            background: #000;
            display: flex;
            justify-content: center;
        }

        .tweet-video-container video, .tweet-video-container iframe {
            max-width: 100%;
            max-height: 500px;
            display: block;
        }

        .cargando {
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header-blog">
        <h1>[ LAB_LOG ]</h1>
        <a href="../" class="btn-volver"><- Volver al inicio</a>
    </div>

    <main class="contenedor-tweets" id="feed-tweets">
        <p class="cargando">Conectando con el laboratorio público...</p>
    </main>

    <script>
        const USUARIO_GITHUB = 'demilolmanso'; 
        const REPO_NAME = 'Agorlab'; 

        const contenedor = document.getElementById('feed-tweets');

        async function cargarTweets() {
            try {
                const urlApi = `https://api.github.com/repos/${USUARIO_GITHUB}/${REPO_NAME}/contents/microblog/posts`;
                const respuesta = await fetch(urlApi);
                
                if (!respuesta.ok) {
                    contenedor.innerHTML = "<p class='cargando'>El silencio invadió todas las casas de Italia...</p>";
                    return;
                }

                const archivos = await respuesta.json();
                contenedor.innerHTML = '';

                archivos.reverse();

                for (let archivo of archivos) {
                    if (archivo.name.endsWith('.md')) {
                        const resPost = await fetch(archivo.download_url);
                        const textoRaw = await resPost.text();

                        const partes = textoRaw.split('---');
                        if (partes.length >= 3) {
                            const metadata = partes[1];
                            const cuerpo = partes.slice(2).join('---').trim();

                            // Extrae la fecha del post
                            const matchFecha = metadata.match(/date:\s*(.+)/);
                            let fechaFormateada = "Fecha desconocida";
                            
                            if (matchFecha) {
                                const d = new Date(matchFecha[1]);
                                fechaFormateada = d.toLocaleDateString('es-AR', {
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                });
                            }

                            // Extrae la foto
                            const matchFoto = metadata.match(/foto:\s*["']?([^"'\n\r]+)["']?/);
                            let fotoHtml = '';
                            if (matchFoto && matchFoto[1]) {
                                fotoHtml = `<img src="${matchFoto[1].trim()}" class="tweet-foto" alt="Imagen del laboratorio">`;
                            }

                            // LÓGICA DE VIDEO MEJORADA (Para evitar bloqueos de Instagram)
                            const matchVideo = metadata.match(/video:\s*["']?([\s\S]*?)["']?(?=\n\w+:|$)/);
                            let videoHtml = '';
                            if (matchVideo && matchVideo[1] && matchVideo[1].trim() !== "") {
                                const contenidoVideo = matchVideo[1].trim();

                                // Si es un iframe ya armado (ej: de YouTube), lo deja pasar directo
                                if (contenidoVideo.includes('<iframe')) {
                                    videoHtml = `<div class="tweet-video-container">${contenidoVideo}</div>`;
                                } else {
                                    // Si pegaste un enlace directo (.mp4 o similar), usa la etiqueta nativa de HTML5
                                    videoHtml = `
                                        <div class="tweet-video-container">
                                            <video controls playsinline preload="metadata">
                                                <source src="${contenidoVideo}" type="video/mp4">
                                                Tu navegador no soporta reproducción de video.
                                            </video>
                                        </div>
                                    `;
                                }
                            }

                            const tweetHtml = `
                                <article class="tweet-card">
                                    <div class="tweet-fecha">${fechaFormateada} hs</div>
                                    <div class="tweet-contenido">${cuerpo}</div>
                                    ${fotoHtml}
                                    ${videoHtml}
                                </article>
                            `;
                            contenedor.innerHTML += tweetHtml;
                        }
                    }
                }

                if (contenedor.innerHTML === '') {
                    contenedor.innerHTML = "<p class='cargando'>No se encontraron posteos válidos.</p>";
                }

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = "<p class='cargando'>Error al conectar con la base de datos del laboratorio.</p>";
            }
        }

        cargarTweets();
    </script>
</body>
</html>
