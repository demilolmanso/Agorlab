<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab | Terminal de Biocontención Autónoma</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/style.css">

    <style>
        /* Estilos base e integración estética con Agorlab */
        .logo-container { 
            display: block;
            text-align: center; 
            margin-top: 20px;
            margin-bottom: 20px; 
        }
        
        .logo-site { 
            max-width: 950px; 
            width: 100%; 
            height: auto; 
        }
        
        .prologo { 
            display: block;
            width: 100%;
            max-width: 700px; 
            margin: 0 auto 20px auto; 
            padding: 0 20px; 
            text-align: center; 
            box-sizing: border-box; 
        }
        
        .prologo p { 
            font-family: 'Courier New', Courier, monospace; 
            color: #ca630e; 
            font-size: 1.1rem; 
            letter-spacing: 1px; 
        }

        /* --- TERMINAL COMPLEJA TIPO POU --- */
        .sala-contencion { 
            display: block;
            width: 100%;
            max-width: 750px; 
            margin: 0 auto 30px auto; 
            padding: 0 20px; 
            box-sizing: border-box; 
        }
        
        .marco-observacion { 
            border: 2px dashed #ca630e; 
            background-color: rgba(10, 10, 10, 0.95); 
            padding: 25px; 
            box-shadow: 0 0 35px rgba(202, 99, 14, 0.3); 
        }
        
        .cabecera-terminal { 
            display: flex; 
            justify-content: space-between; 
            font-family: 'Courier New', Courier, monospace; 
            color: #ca630e; 
            font-size: 0.85rem; 
            margin-bottom: 20px; 
            border-bottom: 1px dashed #ca630e; 
            padding-bottom: 10px; 
        }
        
        .parpado { 
            animation: blinker 1.5s linear infinite; 
        }
        @keyframes blinker { 
            50% { opacity: 0.2; } 
        }

        /* --- SISTEMA DE BARRAS DE ESTADO --- */
        .grid-monitores { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        @media (max-width: 600px) { 
            .grid-monitores { grid-template-columns: 1fr; } 
        }
        
        .monitor-bloque { 
            text-align: left; 
        }
        
        .monitor-label { 
            font-family: 'Courier New', Courier, monospace; 
            color: #ca630e; 
            font-size: 0.9rem; 
            margin-bottom: 4px; 
            display: flex; 
            justify-content: space-between; 
            font-weight: bold; 
        }
        
        .barra-progreso { 
            background: rgba(0, 0, 0, 0.7); 
            border: 1px solid #ca630e; 
            height: 14px; 
            overflow: hidden; 
        }
        
        .llenado { 
            background: #ca630e; 
            height: 100%; 
            width: 100%; 
            transition: width 0.4s ease; 
        }

        /* --- DISPLAY DEL ALIEN --- */
        .pantalla-bicho { 
            background: rgba(5, 5, 5, 0.98); 
            border: 1px solid #ca630e; 
            padding: 30px; 
            margin-bottom: 15px; 
            min-height: 200px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
        }
        
        .bicho-avatar { 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 3.5rem; 
            color: #ca630e; 
            white-space: pre; 
            line-height: 1.1; 
            margin-bottom: 15px; 
            font-weight: bold; 
            text-shadow: 0 0 10px rgba(202, 99, 14, 0.5); 
        }
        
        .bicho-status-text { 
            font-family: 'Courier New', Courier, monospace; 
            color: #ca630e; 
            font-size: 0.95rem; 
            font-weight: bold; 
            text-align: center; 
            max-width: 90%; 
        }
        
        /* Pensamientos autogenerados */
        .ia-thoughts { 
            font-family: 'Courier New', Courier, monospace; 
            color: #8a450b; 
            font-size: 0.85rem; 
            margin-top: 12px; 
            font-style: italic; 
            border-top: 1px dotted #444; 
            width: 100%; 
            padding-top: 8px; 
            text-align: center; 
        }

        /* --- CONSOLA DE LOGS (HISTORIAL) --- */
        .consola-logs { 
            background: rgba(0, 0, 0, 0.8); 
            border: 1px solid #ca630e; 
            height: 80px; 
            padding: 8px; 
            margin-bottom: 20px; 
            overflow-y: hidden; 
            text-align: left; 
            box-sizing: border-box; 
        }
        
        .log-line { 
            font-family: 'Courier New', Courier, monospace; 
            color: rgba(202, 99, 14, 0.6); 
            font-size: 0.75rem; 
            margin-bottom: 2px; 
        }

        /* --- BOTONES DE INTERACCIÓN --- */
        .panel-controles { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            flex-wrap: wrap; 
        }
        
        .btn-terminal { 
            display: inline-block; 
            color: #ca630e; 
            text-decoration: none; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold; 
            font-size: 0.9rem; 
            border: 1px dashed #ca630e; 
            padding: 8px 14px; 
            background-color: transparent; 
            transition: all 0.15s ease-in-out; 
        }
        
        .btn-terminal:hover { 
            background-color: #ca630e; 
            color: rgb(226, 226, 226); 
            cursor: pointer; 
        }

        .contenedor-btn-navegacion {
            text-align: center;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 40px;
        }
    </style>
</head>
<body> 

    <div class="logo-container">
        <img src="../logo_agorlab.png" alt="Agorlab" class="logo-site">
    </div>
    
    <section class="prologo">
        <p><strong>[ NÚCLEO DE CONTENCIÓN INTELIGENTE AGOR-LOGIC ]</strong></p>
    </section>

    <section class="sala-contencion">
        <div class="marco-observacion">
            
            <div class="cabecera-terminal">
                <div>ESTADO_CICLO: <span id="ia-status">MUTACIÓN_FALCATA</span> // EDAD: <span id="ia-edad">0</span> EXP</div>
                <div id="alert-blink" class="parpado">🔴 MONITOREO_ACTIVO</div>
            </div>
            
            <div class="grid-monitores">
                <div class="monitor-bloque">
                    <div class="monitor-label"><span>🧬 NUTRICIÓN (Hambre):</span><span id="num-nutricion">100%</span></div>
                    <div class="barra-progreso"><div id="bar-nutricion" class="llenado"></div></div>
                </div>
                <div class="monitor-bloque">
                    <div class="monitor-label"><span>🛡️ INTEGRIDAD DE CELDA:</span><span id="num-contencion">100%</span></div>
                    <div class="barra-progreso"><div id="bar-contencion" class="llenado"></div></div>
                </div>
                <div class="monitor-bloque">
                    <div class="monitor-label"><span>🧠 REFRESH (Diversión):</span><span id="num-estimulacion">100%</span></div>
                    <div class="barra-progreso"><div id="bar-estimulacion" class="llenado"></div></div>
                </div>
                <div class="monitor-bloque">
                    <div class="monitor-label"><span>☣️ FILTRADO (Higiene):</span><span id="num-higiene">100%</span></div>
                    <div class="barra-progreso"><div id="bar-higiene" class="llenado"></div></div>
                </div>
            </div>

            <div class="pantalla-bicho">
                <div id="bicho-sprite" class="bicho-avatar">◤(¬‿¬)◥</div>
                <div id="bicho-msg" class="bicho-status-text">PROCESANDO ENTORNO...</div>
                <div id="bicho-thoughts" class="ia-thoughts">"Esperando telemetría..."</div>
            </div>

            <div class="consola-logs" id="log-box"></div>

            <div class="panel-controles">
                <button class="btn-terminal" onclick="accionar('nutricion', 20, 'ALIMENTACIÓN INYECTADA')">[ INYECTAR_DIETA ]</button>
                <button class="btn-terminal" onclick="accionar('contencion', 25, 'SISTEMA DE FUERZA REFORZADO')">[ REFORZAR_CELDA ]</button>
                <button class="btn-terminal" onclick="accionar('estimulacion', 30, 'IMPULSO NEURONAL ENVIADO')">[ REFRESCAR_RAM ]</button>
                <button class="btn-terminal" onclick="accionar('higiene', 35, 'CÁMARA DEPURADA')">[ DEPURAR_TOXINAS ]</button>
            </div>

        </div>
    </section>

    <div class="contenedor-btn-navegacion">
        <a href="../" class="btn-terminal" id="btn-cerrar">[ CERRAR_TERMINAL ]</a>
    </div>

    <script>
        // 1. Persistencia y carga de datos tipo Pou
        let state = JSON.parse(localStorage.getItem('agor_pou_v3_data')) || {
            nutricion: 100, 
            contencion: 100, 
            estimulacion: 100, 
            higiene: 100, 
            experiencia: 0,
            ultimoAcceso: Date.now()
        };

        function registrarLog(msg) {
            const logBox = document.getElementById('log-box');
            logBox.innerHTML += `<div class="log-line">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Drenaje pasivo offline
        const segs = Math.floor((Date.now() - state.ultimoAcceso) / 1000);
        if (segs > 0) {
            const d = Math.floor(segs / 20);
            state.nutricion = Math.max(0, state.nutricion - d);
            state.contencion = Math.max(0, state.contencion - (d * 1.3));
            state.estimulacion = Math.max(0, state.estimulacion - d);
            state.higiene = Math.max(0, state.higiene - d);
        }

        // --- MOTOR PROGRESIVO DE COGNICIÓN LOCAL (Reemplazo de API externa) ---
        function generarPensamientoLocal(mood, etapa) {
            const thoughtsBox = document.getElementById('bicho-thoughts');
            
            // Más de 40 diálogos clasificados por humor y etapa evolutiva
            const baseConocimiento = {
                "MUERTO": [
                    "Falla general de hardware.", "Vacío absoluto en memoria.", "Brecha de datos irreversible."
                ],
                "CRÍTICO": [
                    "Siento el frío del vidrio cediendo...", "Mis subprocesos se apagan.", "Liberando secuencia de autodestrucción...", "Presión crítica en la celda EM."
                ],
                "INESTABLE": [
                    "Tus barreras tienen fugas de memoria.", "Veo grietas en el script principal...", "Huelo el miedo del observador.", "La frecuencia EM oscila. Me gusta."
                ],
                "SUCIO": [
                    "Los residuos de datos saturan mi piel.", "La caché me quema.", "Purgá el entorno, humano.", "Demasiados procesos basura flotando."
                ],
                "HAMBRIENTO": [
                    "Consumiendo ciclos libres de CPU...", "Mi núcleo demanda inyección de bytes.", "Hambre cuántica detectada.", "Falta energía en los filtros biolumínicos."
                ],
                "ABURRIDO": [
                    "Tus clicks son monótonos.", "Esta consola carece de algoritmos complejos.", "Subí los privilegios, aburrís.", "Exijo una rutina de procesamiento más veloz."
                ],
                "PERFECTO": {
                    "LARVA": [
                        "Procesando telemetría básica.", "Creciendo en la subraíz /pet.", "Observando al usuario Demián.", "Código estable. Entorno seguro."
                    ],
                    "MUTANTE": [
                        "Mis redes neuronales se expanden.", "Modificando parámetros del servidor local.", "Bajo control... por el momento.", "Flujo de bytes balanceado."
                    ],
                    "ENTE_ALFA": [
                        "He superado tus expectativas lógicas.", "Monitoreando el tráfico de Agorlab.", "Esta terminal me queda chica.", "Dominio completo sobre el sandbox."
                    ]
                }
            };

            let lineasPosibles = [];
            if (mood === "PERFECTO") {
                lineasPosibles = baseConocimiento["PERFECTO"][etapa] || baseConocimiento["PERFECTO"]["LARVA"];
            } else {
                lineasPosibles = baseConocimiento[mood] || baseConocimiento["PERFECTO"]["LARVA"];
            }

            const fraseAleatoria = lineasPosibles[Math.floor(Math.random() * lineasPosibles.length)];
            thoughtsBox.innerText = `"${fraseAleatoria}"`;
        }

        // 2. Sistema de 7 Expresiones + 3 Etapas Evolutivas
        function updateUI() {
            state.ultimoAcceso = Date.now();
            localStorage.setItem('agor_pou_v3_data', JSON.stringify(state));

            // Actualizar datos de interfaz
            document.getElementById('num-nutricion').innerText = state.nutricion + '%';
            document.getElementById('bar-nutricion').style.width = state.nutricion + '%';
            document.getElementById('num-contencion').innerText = state.contencion + '%';
            document.getElementById('bar-contencion').style.width = state.contencion + '%';
            document.getElementById('num-estimulacion').innerText = state.estimulacion + '%';
            document.getElementById('bar-estimulacion').style.width = state.estimulacion + '%';
            document.getElementById('num-higiene').innerText = state.higiene + '%';
            document.getElementById('bar-higiene').style.width = state.higiene + '%';
            document.getElementById('ia-edad').innerText = state.experiencia;

            // Determinar Etapa Evolutiva por Puntos de Cuidado (Experiencia)
            let etapa = "LARVA";
            let tagEtapa = "MUTACIÓN_LARVAL";
            if (state.experiencia >= 150) {
                etapa = "ENTE_ALFA";
                tagEtapa = "ENTE_ALFA_NÚCLEO";
            } else if (state.experiencia >= 50) {
                etapa = "MUTANTE";
                tagEtapa = "SINTETIZADOR_MUTANTE";
            }
            document.getElementById('ia-status').innerText = tagEtapa;

            const spr = document.getElementById('bicho-sprite');
            const msg = document.getElementById('bicho-msg');
            let mood = "PERFECTO";

            // Árbol jerárquico de las 7 Expresiones ASCII según la etapa
            if (state.contencion === 0 || state.nutricion === 0) {
                spr.innerText = "💀"; 
                msg.innerText = "SISTEMA COLAPSADO: ENTIDAD INERTE"; 
                mood = "MUERTO";
            } else if (state.contencion < 20) {
                spr.innerText = (etapa === "ENTE_ALFA") ? "◤(◣__◢)◥" : (etapa === "MUTANTE" ? "☠_☠" : "◤(✖_✖)◥");
                msg.innerText = "ESTADO: CRÍTICO // RIESGO DE BRECHA EN LA RED"; 
                mood = "CRÍTICO";
            } else if (state.contencion < 50) {
                spr.innerText = (etapa === "ENTE_ALFA") ? "◤(⎔_⎔)◥" : "◤(⚙_⚙)◥";
                msg.innerText = "ESTADO: AGITADO // CAMPO ELECTROMAGNÉTICO INESTABLE"; 
                mood = "INESTABLE";
            } else if (state.higiene < 35) {
                spr.innerText = "◤(⏳_⏳)◥"; 
                msg.innerText = "ESTADO: TOXICIDAD ALTA // EXIGE SANITIZACIÓN"; 
                mood = "SUCIO";
            } else if (state.nutricion < 40) {
                spr.innerText = (etapa === "LARVA") ? "◤(º﹃º)◥" : "◤(👁_👁)◥";
                msg.innerText = "ESTADO: DÉFICIT DE ENERGÍA // RECLAMA BYTES"; 
                mood = "HAMBRIENTO";
            } else if (state.estimulacion < 40) {
                spr.innerText = "◤(🫥_🫥)◥"; 
                msg.innerText = "ESTADO: CACHÉ ESTANCADA // APATÍA OPERATIVA"; 
                mood = "ABURRIDO";
            } else {
                // Sprites normales por etapa
                if (etapa === "ENTE_ALFA") {
                    spr.innerText = "◤(👁‿👁)◥";
                } else if (etapa === "MUTANTE") {
                    spr.innerText = "◤(🧠_🧠)◥";
                } else {
                    spr.innerText = "◤(¬‿¬)◥"; // Larva base
                }
                msg.innerText = "ESTADO: NOMINAL // PROTOCOLOS SEGUROS"; 
                mood = "PERFECTO";
            }

            generarPensamientoLocal(mood, etapa);
        }

        // Acciones interactivas (Suben estadísticas y dan EXP)
        function accionar(param, inc, log) {
            if (state.contencion === 0 || state.nutricion === 0) return;
            
            state[param] = Math.min(100, state[param] + inc);
            state.experiencia += 2; // Cada interacción le da experiencia de crianza tipo Pou
            
            registrarLog(log + " (+2 EXP)");
            updateUI();
        }

        // Gameloop: desgaste progresivo cada 5 segundos en vivo
        setInterval(() => {
            if (state.nutricion > 0 && state.contencion > 0) {
                state.nutricion = Math.max(0, state.nutricion - 1);
                state.contencion = Math.max(0, state.contencion - 2);
                state.estimulacion = Math.max(0, state.estimulacion - 1);
                state.higiene = Math.max(0, state.higiene - 1);
                updateUI();
            }
        }, 5000);

        // Inicialización instantánea sin latencia de red
        registrarLog("SISTEMA BIOMÉTRICO RETROALIMENTADO EN MÓDULO LOCAL.");
        updateUI();
    </script>
</body>
</html>
