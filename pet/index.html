<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGORLAB - Protocolo de Contención Mascota</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            color: #39ff14; /* Verde neón / terminal */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .game-container {
            position: relative;
            width: 100vw;
            max-width: 800px;
            height: 75vh;
            max-height: 600px;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .footer-nav {
            margin-top: 15px;
        }
        .btn-back {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .btn-back:hover {
            color: #39ff14;
        }
    </style>
</head>
<body>

    <header>
        <h1>[ Sistema de Monitoreo SCP-PET ]</h1>
    </header>

    <div class="game-container">
        <iframe src="game-files/index.html" title="Contención de Criatura"></iframe>
    </div>

    <div class="footer-nav">
        <a href="../index.html" class="btn-back">< Volver a la Terminal Central</a>
    </div>

</body>
</html>
