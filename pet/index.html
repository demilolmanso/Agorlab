<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab | Terminal de Contención - Espécimen Virtual</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <link rel="stylesheet" href="/style.css">

    <style>
        /* Estilos heredados del main index de agorlab.com */
        .logo-container {
            display: block;
            text-align: center;
            margin-top: 20px;    
            margin-bottom: 20px; 
        }

        .logo-site {
            max-width: 950px;   
            width: 100%;        
            height: auto;       
        }

        .prologo {
            display: block;
            width: 100%;
            max-width: 750px;    
            margin: 0 auto 20px auto; 
            padding: 0 20px;     
            text-align: center;  
            box-sizing: border-box;
        }

        .prologo p {
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            font-size: 1.1rem;   
            line-height: 1.6;    
            letter-spacing: 1px;
            margin-bottom: 1rem; 
        }

        /* --- CONSOLA DEL TAMAGOTCHI NATIVO --- */
        .sala-contencion {
            display: block;
            width: 100%;
            max-width: 650px;
            margin: 0 auto 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .marco-observacion {
            border: 2px dashed #ca630e;
            background-color: rgba(20, 20, 20, 0.8);
            padding: 25px;
            box-shadow: 0 0 20px rgba(202, 99, 14, 0.15);
            border-radius: 4px;
        }

        .status-terminal {
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            font-size: 0.9rem;
            text-align: left;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .parpado {
            animation: blinker 2s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.3; }
        }

        /* --- MONITORES DE ESTADO (BARRAS) --- */
        .panel-monitores {
            margin-bottom: 25px;
            text-align: left;
        }

        .monitor-label {
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            font-size: 1rem;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .barra-progreso {
            background: #222;
            border: 1px solid #ca630e;
            height: 16px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .llenado {
            background: #ca630e;
            height: 100%;
            width: 100%; /* Se maneja dinámicamente con JS */
            transition: width 0.4s ease;
        }

        /* --- EL ESPÉCIMEN (RENDER RETRO) --- */
        .pantalla-bicho {
            background: #0d0d0d;
            border: 1px solid #ca630e;
            padding: 30px;
            margin-bottom: 25px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bicho-avatar {
            font-family: 'Courier New', Courier, monospace;
            font-size: 3.5rem;
            color: #ca630e;
            white-space: pre;
            line-height: 1;
            margin-bottom: 15px;
        }

        .bicho-status-text {
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* --- BOTONES DE ACCIÓN DE LA TERMINAL --- */
        .
