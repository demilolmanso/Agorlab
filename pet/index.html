<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab | Sala de Contención - Espécimen Virtual</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <link rel="stylesheet" href="/style.css">

    <style>
        /* Estilos heredados y adaptados de agorlab.com main index */
        .logo-container {
            display: block;
            text-align: center;
            margin-top: 20px;    
            margin-bottom: 20px; 
        }

        .logo-site {
            max-width: 950px;   
            width: 100%;        
            height: auto;       
        }

        .prologo {
            display: block;
            width: 100%;
            max-width: 750px;    
            margin: 0 auto 30px auto; 
            padding: 0 20px;     
            text-align: center;  
            box-sizing: border-box;
        }

        .prologo p {
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            font-size: 1.1rem;   
            line-height: 1.6;    
            letter-spacing: 1px;
            margin-bottom: 1rem; 
        }

        /* --- CONTENEDOR DE LA SALA DE CONTENCIÓN (Juego GDevelop) --- */
        .sala-contencion {
            display: block;
            width: 100%;
            max-width: 840px; /* Ajustado al estándar de pantallas de GDevelop */
            margin: 0 auto 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Estructura estilo Terminal de Observación / Cámara Hiperbárica */
        .marco-observacion {
            border: 2px dashed #ca630e; /* Manteniendo la estética de tus bordes */
            background-color: rgba(20, 20, 20, 0.5);
            padding: 15px;
            box-shadow: 0 0 15px rgba(202, 99, 14, 0.15);
            position: relative;
        }

        .status-terminal {
            font-family: 'Courier New', Courier, monospace;
            color: #ca630e;
            font-size: 0.9rem;
            text-align: left;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* El iframe que renderiza tu export de GDevelop */
        .ventana-bicho {
            width: 100%;
            /* Relación de aspecto estándar 16:9 para juegos web, se adapta en celular */
            aspect-ratio: 16 / 9; 
            max-height: 450px;
            border: 1px solid #ca630e;
            background: #000;
            display: block;
        }

        /* --- BOTONERÍA DE NAVEGACIÓN --- */
        .contenedor-btn-navegacion {
            text-align: center;
            width: 100%;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .btn-regresar {
            display: inline-block;
            color: #ca630e;
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border: 1px dashed #ca630e;
            padding: 10px 20px;
            background-color: transparent;
            transition: all 0.2s ease-in-out;
        }

        .btn-regresar:hover {
            background-color: #ca630e;
            color: rgb(226, 226, 226);
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        /* Animación sutil de parpadeo para la alerta de terminal */
        .parpado {
            animation: blinker 2s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body> 

    <div class="logo-container">
        <img src="../logo_agorlab.png" alt="Agorlab" class="logo-site">
    </div>
    
    <section class="prologo">
        <p><strong>[ ÁREA_DE_CONTENCIÓN_AGOR-01 ]</strong></p>
        <p>Estás observando un espécimen digital en cautiverio. Este entorno hiperbárico requiere monitoreo constante para evitar brechas en el servidor.</p>
    </section>

    <section class="sala-contencion">
        <div class="marco-observacion">
            <div class="status-terminal">
                ⚡ SISTEMA: ONLINE // <span class="parpado">🔴 MONITOREANDO_SUJETO</span>
            </div>
