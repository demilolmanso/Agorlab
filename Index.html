<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agorlab</title>
    <style>
        /*  estilos :3  */
        .prologo {
            max-width: 650px;    /* Evita que el texto supere los 650px de ancho */
            margin: 0 auto;      /* Centra todo el bloque en el medio de la pantalla */
            padding: 0 20px;     /* Deja un colchón a los lados para que en celular no pegue al borde */
        }

        .prologo p {  /* Hace la letra un toque más grande y de 'laboratorio' */
              /* Le da un interlineado cómodo para que el ojo no se canse */
            margin-bottom: 1.5rem; /* Separa un párrafo del otro si tenés varios */
        }
        h1 {
            color: #e97020;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            letter-spacing: 8px;
        }
        p {
            color: #ca630e;
            font-family: 'Courier New', Courier, monospace;;
        }
        body {background-color: rgb(226, 226, 226);}
    </style>
</head>
<body> 

    <h1 style="font-size: 80px; text-align: center;">Agorlab</h1>
    <section class="prologo"><p style="color: #ca630e; text-align: center;">Hola, mi nombre es Demián y creo firmemente que la mejor forma de aprender es haciendo.<br> Agorlab es mi diario y taller: un espacio híbrido entre blog y laboratorio digital donde documento experimentos web y proyectos propios.</p></section>

</body>
</html>
