backend:
  name: git-gateway
  branch: main # O master, según tu rama principal

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "microblog"
    label: "Mis Tweets"
    folder: "microblog/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # ESTO ARREGLA EL ERROR: Le dice al CMS que use la fecha como identificador visual
    identifier_field: date 
    fields:
      - { label: "Título de control (No se ve en el tweet)", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "¿Qué estás rompiendo o arreglando hoy?", name: "body", widget: "text" }
