<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOS: Álbum</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div id="modal-registro" class="modal">
        <div class="modal-content terminal-box">
            <h2>[ NUEVO_REGISTRO ]</h2>
            <p>Crea tu cromo e imprímelo en la base de datos global.</p>
            
            <input type="text" id="reg-nombre" placeholder="> Nombre y Apellido" class="reg-input">
            <input type="text" id="reg-rol" placeholder="> Rol / Ocupación" class="reg-input">
            
            <div class="foto-registro-container">
                <video id="video-feed" autoplay playsinline class="hidden"></video>
                <canvas id="canvas-foto" class="hidden"></canvas>
                <div id="foto-placeholder">[ SQUUSH_FACE_HERE ]</div>
                
                <button id="btn-activar-camara" class="btn-terminal-sm">> Activar Cámara</button>
                <button id="btn-capturar-foto" class="btn-terminal-sm hidden">> Capturar</button>
            </div>

            <button class="close-btn btn-interactivo" id="btn-guardar-perfil" style="margin-top: 25px; width: 100%;">[ INYECTAR_CROMO ]</button>
        </div>
    </div>
    
    <!-- Encabezado de la App -->
    <header class="app-header">
        <h1>VOS: Comunidad</h1>
        <div class="stats">Figus: <span id="counter">0/0</span></div>
    </header>
<nav class="app-nav">
        <button class="nav-btn active" id="btn-ver-album">📖 Álbum</button>
        <button class="nav-btn pack-btn" id="open-pack-trigger">✨ Sobre</button>
        <button class="nav-btn" id="btn-mi-qr">🪪 Mi QR</button>
        <button class="nav-btn" id="btn-scan-qr">📷 Escanear</button>
    </nav>
    <!-- Contenedor del Álbum -->
    <main class="album-grid">
        <!-- El JS inyectará las cartas aquí -->
    </main>

    <!-- Modales de QR -->
    <div id="modal-mi-qr" class="modal hidden">
        <div class="modal-content terminal-box">
            <h2>Tu Código QR</h2>
            <p>Muéstralo para que te agreguen</p>
            <div id="qrcode-container"></div>
            <button class="close-btn" id="close-qr-btn">Cerrar</button>
        </div>
    </div>

    <div id="modal-scanner" class="modal hidden">
        <div class="modal-content terminal-box">
            <h2>Escanea a un compañero</h2>
            <div id="reader" style="width: 100%; max-width: 300px; margin: auto; background: white;"></div>
            <button class="close-btn" id="close-scanner-btn" style="margin-top: 15px;">Cancelar</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
